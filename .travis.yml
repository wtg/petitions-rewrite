language: python
matrix:
  include:
    - python: "3.6"
      dist: trusty
      sudo: true
    - python: "3.7"
      dist: xenial
      sudo: true

before_install:
  - pip install pipenv

install: 
  - pipenv install --python 3.6

before_script:
  - pipenv check
  - black . --check

script:
  - pipenv run python manage.py test
